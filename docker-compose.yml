version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: telematics_postgres
    restart: always
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_MULTIPLE_DATABASES: auth_db,pqrs_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telematics_redis
    restart: always
    ports:
      - "6379:6379"

  # Production images (same ones deployed to Azure). Run with:
  #   docker compose --profile app up --build
  auth-service:
    profiles: ["app"]
    build: ./services/auth-service
    environment:
      DATABASE_URL: postgresql://dev_user:dev_password@postgres:5432/auth_db
      JWT_SECRET: local_dev_jwt_secret
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  pqrs-service:
    profiles: ["app"]
    build: ./services/pqrs-service
    environment:
      DATABASE_URL: postgresql://dev_user:dev_password@postgres:5432/pqrs_db
      REDIS_HOST: redis
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      COMPANY_CATEGORIES: PETITION,COMPLAINT,CLAIM,SUGGESTION
      COMPANY_PRIORITIES: LOW,MEDIUM,HIGH,CRITICAL
      COMPANY_DEPARTMENTS: Technical Support,Billing,Customer Care,Legal,Logistics,Network Operations
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
